<!doctype html>
<html lang="zh-CN" data-pet-app="xiaoban">
<head><meta charset="utf-8"><title>PawPlusMe</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="popup.css"><script src="site-config.js" defer></script><script src="pet-i18n.js" defer></script><script src="pet-focus.js" defer></script><script src="pet-shortcuts.js" defer></script><script src="popup.js" defer></script></head>
<body>
<header class="popup-header"><h1>Paw<span>Plus</span>Me</h1><label class="language-picker"><span class="sr-only" data-pet-i18n="语言">语言</span><select id="language" data-pet-language aria-label="语言" data-pet-i18n-aria-label="语言"><option value="zh">简体中文</option><option value="en">English</option><option value="es">Español</option><option value="ja">日本語</option></select></label></header>
<div id="pet-identity" class="pet-identity" hidden><canvas id="pet-avatar" width="96" height="96" role="img" aria-label="宠物头像"></canvas><div><strong id="pet-name"></strong><span data-pet-i18n="住在浏览器里的小伙伴">住在浏览器里的小伙伴</span></div></div>
<div id="pet-switcher" class="pet-switcher" hidden><label for="pet-select" data-pet-i18n="我的宠物">我的宠物</label><select id="pet-select" aria-label="我的宠物" data-pet-i18n-aria-label="我的宠物"></select></div>
<p id="pet-switch-status" role="status" aria-live="polite" hidden></p>
<p id="status" role="status">正在看看小伙伴在不在…</p>
<button id="recall" type="button" class="primary" disabled data-pet-i18n="召唤回来">召唤回来</button>
<button id="stop-follow" type="button" hidden disabled data-pet-i18n="停止跟随">停止跟随</button>
<section class="quick-shortcuts" aria-label="动作快捷键" data-pet-i18n-aria-label="动作快捷键"><div class="quick-heading"><strong data-pet-i18n="动作快捷键">动作快捷键</strong><button id="edit-shortcuts" type="button" data-pet-i18n="编辑">编辑</button></div><dl class="shortcut-overview"><div><dt data-pet-i18n="自动">自动</dt><dd><kbd id="shortcut-hint-auto"></kbd></dd></div><div><dt data-pet-i18n="看鼠标">看鼠标</dt><dd><kbd id="shortcut-hint-look"></kbd></dd></div><div><dt data-pet-i18n="跟着跑">跟着跑</dt><dd><kbd id="shortcut-hint-follow"></kbd></dd></div><div><dt data-pet-i18n="睡个觉">睡个觉</dt><dd><kbd id="shortcut-hint-sleep"></kbd></dd></div></dl></section>
<section class="quick-timer" aria-label="专注计时" data-pet-i18n-aria-label="专注计时"><div><span data-pet-i18n="专注计时">专注计时</span><output id="focus-quick-clock" aria-live="off">25:00</output></div><button id="focus-quick-start" type="button" disabled data-pet-i18n="开始">开始</button></section>
<p id="focus-quick-status" role="status" aria-live="polite" hidden></p>
<fieldset id="controls" disabled><legend data-pet-i18n="陪伴方式">陪伴方式</legend><label class="toggle"><input type="checkbox" id="enabled"><span data-pet-i18n="在网页上显示">在网页上显示</span></label><label for="mode" data-pet-i18n="互动模式">互动模式</label><select id="mode"><option value="auto" data-pet-i18n="自动">自动</option><option value="look" data-pet-i18n="看着鼠标">看着鼠标</option><option value="follow" data-pet-i18n="跟着鼠标跑">跟着鼠标跑</option><option value="sleep" data-pet-i18n="安静睡觉">安静睡觉</option></select><label for="size" data-pet-i18n="宠物大小">宠物大小</label><input id="size" type="range" min="88" max="208" value="144"></fieldset>
<details id="shortcut-settings"><summary data-pet-i18n="动作快捷键">动作快捷键</summary><p class="hint" data-pet-i18n="点选组合键后按下新快捷键。Delete 清除，Esc 取消。">点选组合键后按下新快捷键。Delete 清除，Esc 取消。</p><div class="shortcut-row"><label for="shortcut-auto" data-pet-i18n="自动">自动</label><input id="shortcut-auto" data-shortcut="auto" readonly aria-label="自动快捷键" data-pet-i18n-aria-label="自动快捷键"></div><div class="shortcut-row"><label for="shortcut-look" data-pet-i18n="看鼠标">看鼠标</label><input id="shortcut-look" data-shortcut="look" readonly aria-label="注视快捷键" data-pet-i18n-aria-label="注视快捷键"></div><div class="shortcut-row"><label for="shortcut-follow" data-pet-i18n="跟着跑">跟着跑</label><input id="shortcut-follow" data-shortcut="follow" readonly aria-label="跟随快捷键" data-pet-i18n-aria-label="跟随快捷键"></div><div class="shortcut-row"><label for="shortcut-sleep" data-pet-i18n="睡个觉">睡个觉</label><input id="shortcut-sleep" data-shortcut="sleep" readonly aria-label="睡眠快捷键" data-pet-i18n-aria-label="睡眠快捷键"></div><p id="shortcut-status" role="status" aria-live="polite"></p><div class="shortcut-actions"><button id="shortcut-save" type="button" class="primary" data-pet-i18n="保存快捷键">保存快捷键</button><button id="shortcut-reset" type="button" data-pet-i18n="恢复默认">恢复默认</button></div></details>
<details id="focus-settings"><summary data-pet-i18n="设个闹钟">设个闹钟</summary><fieldset id="focus-controls" disabled><legend class="sr-only" data-pet-i18n="专注计时">专注计时</legend><output id="focus-clock" aria-live="off">25:00</output><p id="focus-status" role="status"></p><button id="focus-start">25 分钟后再来找我</button><button id="focus-preview" data-pet-i18n="立即试一次">立即试一次</button><button id="focus-stop" hidden data-pet-i18n="关闭定时">关闭定时</button></fieldset></details>
<button id="open" class="primary" data-pet-i18n="创建新宠物">创建新宠物</button><small id="return-hint" data-pet-i18n="上传一张照片，制作新的小伙伴。">上传一张照片，制作新的小伙伴。</small><small class="hint" data-pet-i18n="跟随时长按抓住，松开看鼠标；也可按住 Alt 拖动。Esc 停止跟随。">跟随时长按抓住，松开看鼠标；也可按住 Alt 拖动。Esc 停止跟随。</small>
</body></html>
